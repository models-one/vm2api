# Branch images: every branch push builds the amd64 control-plane image and
# pushes it to ghcr.io/<owner>/vm2api as `<branch>` and `sha-<short>`.
# Tag pushes and the `latest` / `edge` / `vX.Y.Z*` tags stay with release.yml.
# Deploy one with VM2API_IMAGE=ghcr.io/<owner>/vm2api VM2API_IMAGE_TAG=<branch>.
name: branch-image

on:
  push:
    branches: ['**']
    paths-ignore:
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

# A newer push to the same branch supersedes the build in flight.
concurrency:
  group: branch-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image-amd64:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # A push that moves the payload pin also starts mirror-payload.yml; the
      # Dockerfile downloads from those releases, so wait until each is complete.
      # crag assets live in their own release (manifest.crag_release).
      - name: wait for the pinned payload releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo=$(node -p 'require("./deploy/payload.json").repo')
          if [ "$repo" != "$GITHUB_REPOSITORY" ]; then
            echo "payload hosted by ${repo}"
            exit 0
          fi
          node - <<'NODE' > "$RUNNER_TEMP/payload-releases.txt"
          const manifest = require("./deploy/payload.json")
          const isCrag = (f) => f.path.startsWith('share/crag/') || f.path === 'dist/crag-v2-licensed-amd64.tar.gz'
          const count = (predicate) => new Set(manifest.files.filter(predicate).map((f) => f.asset)).size
          console.log(`${manifest.release}\t${count((f) => !isCrag(f))}`)
          const crag = manifest.crag_release || manifest.release
          if (crag !== manifest.release) console.log(`${crag}\t${count(isCrag)}`)
          NODE
          waited=0
          for i in $(seq 1 60); do
            pending=''
            while IFS=$'\t' read -r release want; do
              have=$(gh release view "$release" --repo "$repo" --json assets \
                --jq '[.assets[] | select(.state == "uploaded")] | length' 2>/dev/null || echo 0)
              if [ "$have" -lt "$want" ]; then
                pending="$pending $release($have/$want)"
              fi
            done < "$RUNNER_TEMP/payload-releases.txt"
            if [ -z "$pending" ]; then
              echo "payload releases complete"
              # Freshly uploaded assets can 404 on the download CDN for a moment.
              if [ "$i" -gt 1 ]; then sleep 60; fi
              exit 0
            fi
            echo "waiting on:$pending"
            sleep 30
          done
          echo "::error::pinned payload releases are incomplete; run mirror-payload.yml"
          exit 1
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: resolve image tags
        id: meta
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          image="ghcr.io/$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')/vm2api"
          # Docker tags: [a-z0-9_.-], at most 128 chars, no leading '.' or '-'.
          slug=$(printf '%s' "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's#[^a-z0-9_.-]+#-#g; s#^[.-]+##' | cut -c1-120)
          # Never overwrite the tags release.yml and the compose files own.
          case "$slug" in
            latest | edge | edge-* | dev | v[0-9]*) slug="branch-${slug}" ;;
          esac
          {
            echo "slug=${slug}"
            echo "ref=${image}:${slug}"
            echo "tags<<EOF"
            echo "${image}:${slug}"
            echo "${image}:sha-${GITHUB_SHA::7}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: control plane image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          provenance: false
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # Links the package to this repo so GITHUB_TOKEN keeps write access.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # Branches can read the default branch's cache, so main seeds the rest.
          cache-from: |
            type=gha,scope=branch-image-${{ steps.meta.outputs.slug }}
            type=gha,scope=branch-image-main
          cache-to: type=gha,scope=branch-image-${{ steps.meta.outputs.slug }},mode=max
      - name: summary
        shell: bash
        env:
          REF: ${{ steps.meta.outputs.ref }}
          SLUG: ${{ steps.meta.outputs.slug }}
        run: |
          {
            echo "### Image"
            echo
            echo '```'
            echo "docker pull ${REF}"
            echo '```'
            echo
            echo "Compose: \`VM2API_IMAGE=${REF%:*}\` \`VM2API_IMAGE_TAG=${SLUG}\` (amd64 only)"
          } >> "$GITHUB_STEP_SUMMARY"
